<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לוח גן הגמדים</title>
<meta name="theme-color" content="#e2363f">
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --fg:#1d2a3a; --muted:#5f6f84; --line:#dde4ee;
  --red:#e2363f; --orange:#f39a1c; --sky:#3f7fc8; --grass:#6dbb3c;
  --soft-red:#fde8e9; --soft-sky:#e6f0fb; --soft-orange:#fff1dc;
  --display:"Secular One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121821; --card:#1b2330; --fg:#e8eef6; --muted:#9aa8ba; --line:#2c3746;
  --red:#ff5a62; --orange:#ffad3d; --sky:#6ea6ea; --grass:#8fd35f;
  --soft-red:#3a1e22; --soft-sky:#1b2c42; --soft-orange:#3a2a14; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;direction:rtl;text-align:right}
#app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:14px}
.logo{width:68px;height:68px;border-radius:50%;background:#fff;object-fit:contain;padding:4px;flex:none;border:3px solid var(--orange)}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:.95rem}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--red);color:#fff;border-radius:14px;padding:10px 12px}
.daybar .d{font-family:var(--display);font-size:1.3rem;text-align:center;flex:1}
.daybar .d small{display:block;font-family:var(--body);font-size:.85rem;opacity:.9}
.navbtn{background:rgba(255,255,255,.22);border:0;color:#fff;width:42px;height:42px;border-radius:10px;font-size:1.4rem;cursor:pointer;line-height:1}
.navbtn:disabled{opacity:.35;cursor:default}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
section h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.meal{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line);align-items:baseline}
.meal:first-child{border-top:0;padding-top:2px}
.meal .t{color:var(--sky);font-weight:700}
.meal .t small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.meal .v{min-width:0;font-weight:600;overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft-orange);color:var(--fg);border:2px solid var(--orange);border-radius:999px;padding:4px 14px;font-weight:700}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.ann{display:flex;flex-direction:column;gap:10px}
.ann-item{background:var(--soft-sky);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ann-item .when{font-weight:700;color:var(--sky);white-space:nowrap}
.ann-item .txt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ann-item.important{background:var(--soft-red)}
.ann-item.important .when{color:var(--red)}
.stamp{color:var(--muted);font-size:.85rem;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.main,button.ghost{font-family:var(--body);font-size:1rem;font-weight:700;border-radius:12px;padding:11px 18px;cursor:pointer;border:2px solid transparent}
button.main{background:var(--grass);color:#10260a}
button.main:disabled{opacity:.6}
button.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
label.f{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:6px 0}
label.f span{color:var(--sky);font-weight:700}
input[type=text],input[type=date],input[type=password],input[inputmode=numeric],textarea{font:inherit;font-size:16px;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;text-align:right;direction:rtl}
textarea{min-height:96px;resize:vertical}
.kid{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.kid[aria-pressed="true"]{background:var(--soft-orange);border-color:var(--orange)}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.err{color:var(--red);font-weight:700}
.loading{text-align:center;color:var(--muted);padding:40px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"><div class="loading">טוען את הלוח...</div></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
const SB_URL = "https://cuvleomxegymcrxprfcz.supabase.co";
const SB_KEY = "sb_publishable_DNOGzyDPZNlqpgVB3zcSGQ_989HGdCF";
const TEACHER = /gannenet|teacher/i.test(location.hash + location.search);
const MEALS = [["breakfast","בוקר","08:00"],["ten","ארוחת עשר","10:00"],["lunch","צהריים","12:30"],["four","ארבע","16:00"]];
const tz = "Asia/Jerusalem";
const app = document.getElementById('app');

const todayKey = () => new Intl.DateTimeFormat("en-CA",{timeZone:tz}).format(new Date());
const dt = k => new Date(k+"T12:00:00Z");
const fmtDay = k => ({ wd:new Intl.DateTimeFormat("he-IL",{weekday:"long",timeZone:"UTC"}).format(dt(k)),
  dm:new Intl.DateTimeFormat("he-IL",{day:"numeric",month:"numeric",year:"2-digit",timeZone:"UTC"}).format(dt(k)) });
const fmtShort = k => new Intl.DateTimeFormat("he-IL",{weekday:"short",day:"numeric",month:"numeric",timeZone:"UTC"}).format(dt(k));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v==null?localStorage.removeItem(k):localStorage.setItem(k,v); } catch(e){} };

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600);}

async function api(path, opts={}){
  const r = await fetch(SB_URL+"/rest/v1/"+path,{...opts,headers:{apikey:SB_KEY,"Content-Type":"application/json",...(opts.headers||{})}});
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){} const e=new Error(m||("HTTP "+r.status)); e.msg=m; throw e; }
  const t = await r.text(); return t?JSON.parse(t):null;
}
const rpc = (fn, body) => api("rpc/"+fn,{method:"POST",body:JSON.stringify(body)});
const errText = e => e.msg==="bad_pin"?"קוד שגוי":e.msg==="locked"?"יותר מדי ניסיונות. אפשר לנסות שוב בעוד רבע שעה":"משהו השתבש. בדקו את החיבור ונסו שוב";

let S = {name:"משפחתון גמדים",kids:[],days:{},ann:[]};
let view = null, mode = "parent", pin = lsGet("gan_pin"), draft = null, busy = false;

async function load(){
  const [set, days, ann] = await Promise.all([
    api("gan_settings?id=eq.1&select=name,kids"),
    api("gan_days?select=*&order=day.desc&limit=90"),
    api("gan_announcements?select=*&order=for_date.asc.nullsfirst,created_at.asc")
  ]);
  if(set&&set[0]){S.name=set[0].name;S.kids=set[0].kids||[];}
  S.days={}; (days||[]).forEach(d=>S.days[d.day]=d);
  S.ann=ann||[];
}
const dayKeys = () => Object.keys(S.days).sort();
const blankDay = () => ({meals:{breakfast:"",ten:"",lunch:"",four:""},diapers:[],summary:""});
const upcoming = () => S.ann.filter(a=>!a.for_date||a.for_date>=todayKey());

function header(){return `<header class="top"><img class="logo" src="logo.jpg" alt="לוגו משפחתון גמדים"><div><h1>${esc(S.name)}</h1><div class="sub">${TEACHER?"עדכון הלוח היומי":"הלוח היומי של הגן"}</div></div></header>`;}
function annHTML(list,editable){
  if(!list.length) return `<p class="empty">אין הודעות כרגע</p>`;
  return `<div class="ann">${list.map(a=>`<div class="ann-item${a.important?" important":""}"><span class="when">${a.for_date?esc(fmtShort(a.for_date)):"הודעה"}</span><span class="txt">${esc(a.body)}</span>${editable?`<button class="x" data-del="${esc(a.id)}" aria-label="מחיקת הודעה">✕</button>`:""}</div>`).join("")}</div>`;
}

function parentView(){
  const keys=dayKeys();
  if(view==null){ const ks=keys.filter(k=>k<=todayKey()); view=ks.length?ks[ks.length-1]:todayKey(); }
  const d=S.days[view], f=fmtDay(view);
  const prev=keys.filter(k=>k<view).pop()||null, next=keys.find(k=>k>view)||null;
  let h=header();
  if(TEACHER) h+=`<div class="editbar"><span class="sub">כך ההורים רואים את הלוח</span><button class="main" id="toEdit">עדכון הלוח</button></div>`;
  h+=`<div class="daybar"><button class="navbtn" id="prev" ${prev?"":"disabled"} aria-label="יום קודם">›</button><div class="d">${esc(f.wd)}<small>${esc(f.dm)}${view===todayKey()?" · היום":""}</small></div><button class="navbtn" id="next" ${next?"":"disabled"} aria-label="יום הבא">‹</button></div>`;
  const ann=upcoming();
  if(ann.length) h+=`<section><h2><span class="dot" style="background:var(--red)"></span>הודעות חשובות</h2>${annHTML(ann,false)}</section>`;
  if(!d){ h+=`<section><p class="empty">הגננת עוד לא עדכנה את הלוח ליום הזה.</p></section>`; }
  else{
    const m=d.meals||{};
    h+=`<section><h2><span class="dot" style="background:var(--sky)"></span>מה אכלנו</h2><div>${MEALS.map(([k,n,t])=>`<div class="meal"><div class="t">${n}<small>${t}</small></div><div class="v">${m[k]?esc(m[k]):'<span class="empty">לא עודכן</span>'}</div></div>`).join("")}</div></section>`;
    h+=`<section><h2><span class="dot" style="background:var(--orange)"></span>צריך להביא חיתולים</h2>${(d.diapers||[]).length?`<div class="chips">${d.diapers.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div>`:'<p class="empty">אף אחד היום</p>'}</section>`;
    if(d.summary) h+=`<section><h2><span class="dot" style="background:var(--grass)"></span>מה היה היום בגן</h2><div class="note">${esc(d.summary)}</div></section>`;
    if(d.updated_at) h+=`<div class="stamp">עודכן ${new Intl.DateTimeFormat("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit",timeZone:tz}).format(new Date(d.updated_at))}</div>`;
  }
  app.innerHTML=h;
  document.getElementById('prev').onclick=()=>{view=prev;render();};
  document.getElementById('next').onclick=()=>{view=next;render();};
  const te=document.getElementById('toEdit'); if(te) te.onclick=()=>{mode="edit";view=todayKey();draft=null;render();};
}

function loginView(msg){
  app.innerHTML=header()+`<section><h2><span class="dot" style="background:var(--sky)"></span>כניסה לעדכון הלוח</h2>
  <form id="lf" class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="קוד גננת" style="flex:1"><button class="main" type="submit">כניסה</button></form>
  ${msg?`<p class="err">${esc(msg)}</p>`:'<p class="hint">הקוד נשמר במכשיר, ככה שצריך להקליד אותו רק פעם אחת.</p>'}</section>`;
  document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pin').value.trim();if(!p)return;
    try{ await rpc("gan_login",{p_pin:p}); pin=p; lsSet("gan_pin",p); mode="parent"; render(); }
    catch(err){ loginView(errText(err)); }};
}

function editView(){
  const k=view, f=fmtDay(k);
  if(!draft){ const src=S.days[k]||blankDay(); draft={meals:{...blankDay().meals,...(src.meals||{})},diapers:[...(src.diapers||[])],summary:src.summary||"",kids:[...S.kids]}; }
  let h=header();
  h+=`<div class="editbar"><button class="ghost" id="back">חזרה לתצוגת הורים</button><label class="row" for="edDate"><span class="sub">תאריך</span><input type="date" id="edDate" value="${k}" style="width:auto"></label></div>`;
  h+=`<section><h2><span class="dot" style="background:var(--sky)"></span>מה אכלנו · ${esc(f.wd)} ${esc(f.dm)}</h2>${MEALS.map(([m,n])=>`<label class="f" for="m_${m}"><span>${n}</span><input type="text" id="m_${m}" data-meal="${m}" value="${esc(draft.meals[m])}"></label>`).join("")}</section>`;
  h+=`<section><h2><span class="dot" style="background:var(--orange)"></span>מי צריך להביא חיתולים</h2><div class="chips">${draft.kids.map(n=>`<button class="kid" data-kid="${esc(n)}" aria-pressed="${draft.diapers.includes(n)}">${esc(n)}</button>`).join("")}</div>
  <div class="row" style="margin-top:12px"><input type="text" id="newKid" placeholder="הוספת ילד/ה לרשימה" style="flex:1"><button class="ghost" id="addKid">הוספה</button></div><p class="hint">לוחצים על השם כדי לסמן.</p></section>`;
  h+=`<section><h2><span class="dot" style="background:var(--grass)"></span>מה היה היום בגן</h2><textarea id="summary" placeholder="פעילויות, יצירה, סיפור, משהו מיוחד שקרה...">${esc(draft.summary)}</textarea></section>`;
  h+=`<div class="row" style="justify-content:center"><button class="main" id="save">שמירה ופרסום להורים</button><button class="ghost" id="copy">העתקה לווטסאפ</button></div>`;
  h+=`<section><h2><span class="dot" style="background:var(--red)"></span>הודעות להורים</h2>${annHTML(upcoming(),true)}
  <div style="display:grid;gap:8px;margin-top:12px"><textarea id="annText" placeholder="למשל: ביום חמישי מסיבת פיג'מות, לבוא בפיג'מה" style="min-height:64px"></textarea>
  <div class="row"><label class="row" for="annDate"><span class="sub">לתאריך</span><input type="date" id="annDate" style="width:auto"></label><label class="row" for="annImp"><input type="checkbox" id="annImp"><span class="sub">חשוב</span></label><button class="ghost" id="addAnn">פרסום הודעה</button></div>
  <p class="hint">הודעה עם תאריך יורדת מהלוח אחרי שהתאריך עובר. בלי תאריך היא נשארת עד שמוחקים.</p></div></section>`;
  h+=`<div class="row" style="justify-content:center"><button class="ghost" id="logout">יציאה מהמכשיר</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-meal]').forEach(i=>i.oninput=()=>draft.meals[i.dataset.meal]=i.value);
  document.getElementById('summary').oninput=e=>draft.summary=e.target.value;
  app.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{const n=b.dataset.kid,on=draft.diapers.includes(n);draft.diapers=on?draft.diapers.filter(x=>x!==n):[...draft.diapers,n];b.setAttribute('aria-pressed',String(!on));});
  document.getElementById('addKid').onclick=()=>{const v=document.getElementById('newKid').value.trim();if(v&&!draft.kids.includes(v)){draft.kids.push(v);editView();}};
  document.getElementById('edDate').onchange=e=>{if(!e.target.value)return;view=e.target.value;const kids=draft.kids;draft=null;editView();draft.kids=kids;};
  document.getElementById('back').onclick=()=>{draft=null;mode="parent";render();};
  document.getElementById('save').onclick=save;
  document.getElementById('copy').onclick=copyText;
  document.getElementById('logout').onclick=()=>{lsSet("gan_pin",null);pin=null;draft=null;render();};
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="למחוק?";setTimeout(()=>{b.dataset.armed="";b.textContent="✕";},3000);return;}
    try{ await rpc("gan_del_ann",{p_pin:pin,p_id:b.dataset.del}); await load(); editView(); toast("ההודעה נמחקה"); }catch(e){ handleErr(e); }});
  document.getElementById('addAnn').onclick=async()=>{
    const t=document.getElementById('annText').value.trim(); if(!t){toast("כתבו קודם את ההודעה");return;}
    try{ await rpc("gan_add_ann",{p_pin:pin,p_body:t,p_date:document.getElementById('annDate').value||null,p_important:document.getElementById('annImp').checked}); await load(); editView(); toast("ההודעה פורסמה להורים"); }catch(e){ handleErr(e); }};
}

function handleErr(e){ if(e.msg==="bad_pin"){lsSet("gan_pin",null);pin=null;loginView("הקוד השתנה, צריך להתחבר שוב");} else toast(errText(e)); }

async function save(){
  if(busy) return; busy=true; const b=document.getElementById('save'); b.disabled=true; b.textContent="שומר...";
  try{
    await rpc("gan_save_day",{p_pin:pin,p_day:view,p_meals:draft.meals,p_diapers:draft.diapers,p_summary:draft.summary,p_kids:draft.kids});
    await load(); draft=null; mode="parent"; render(); toast("נשמר. ההורים רואים את העדכון");
  }catch(e){ b.disabled=false; b.textContent="שמירה ופרסום להורים"; handleErr(e); }
  busy=false;
}

function copyText(){
  const f=fmtDay(view);
  let t=`${S.name} · ${f.wd} ${f.dm}\n\n`;
  MEALS.forEach(([k,n])=>{if(draft.meals[k])t+=`${n}: ${draft.meals[k]}\n`;});
  if(draft.diapers.length)t+=`\nלהביא חיתולים: ${draft.diapers.join(", ")}\n`;
  if(draft.summary)t+=`\nמה היה היום:\n${draft.summary}\n`;
  const ann=upcoming(); if(ann.length)t+=`\nהודעות:\n`+ann.map(a=>`• ${a.for_date?fmtShort(a.for_date)+" – ":""}${a.body}`).join("\n")+"\n";
  t+=`\nהלוח המלא: ${location.origin+location.pathname}`;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("הועתק, אפשר להדביק בקבוצה")).catch(()=>toast("ההעתקה לא נתמכת במכשיר הזה"));
}

function render(){
  if(TEACHER && !pin) return loginView();
  if(TEACHER && mode==="edit") return editView();
  parentView();
}

async function start(){
  try{ await load(); render(); }
  catch(e){ app.innerHTML=header()+`<section><p class="err">לא הצלחנו לטעון את הלוח. בדקו את החיבור לאינטרנט ורעננו את הדף.</p></section>`; }
}
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==="visible" && mode==="parent"){ try{ await load(); render(); }catch(e){} } });
start();
})();
</script>
</body>
</html>

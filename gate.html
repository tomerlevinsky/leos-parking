<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פתיחת שער · לאוס מדיה</title>
<meta name="description" content="פותחים מכאן את שער החניון בזמן ההזמנה שלכם, ואז חונים מתחת לשלט "לאוס מדיה · אורחים".">
<meta name="theme-color" content="#5A2DB5">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:site_name" content="לאוס מדיה ואינטראקטיב">
<meta property="og:title" content="פתיחת שער החניון · לאוס מדיה">
<meta property="og:description" content="פותחים מכאן את שער החניון בזמן ההזמנה שלכם, ואז חונים מתחת לשלט "לאוס מדיה · אורחים".">
<meta property="og:url" content="https://parking.leos.co.il/gate.html">
<meta property="og:image" content="https://parking.leos.co.il/og-image.png">

<meta property="og:image:height" content="630">

<meta name="robots" content="noindex">
<link rel="stylesheet" href="common.css">
<style>
  .gate-btn{display:grid;place-items:center;gap:6px;width:min(280px,78vw);aspect-ratio:1;margin:8px auto 4px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent,#5A2DB5);color:#fff;font:inherit;font-family:"Secular One",inherit;font-size:30px;box-shadow:0 14px 40px rgba(90,45,181,.35);transition:transform .12s, opacity .2s}
  .gate-btn:active{transform:scale(.96)} .gate-btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
  .gate-btn small{font-family:"IBM Plex Sans Hebrew",inherit;font-size:14px;opacity:.85}
  .gate-btn.ok{background:#178a4c} .gate-msg{text-align:center;min-height:1.6em;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">P</div>
      <div><span class="eyebrow">לאוס מדיה ואינטראקטיב</span><h1>שער החניון</h1><p class="sub" id="sub">טוען…</p></div>
    </div>
  </header>

  <section class="panel" id="main">
    <button type="button" class="gate-btn" id="open" disabled>פתיחת שער<small id="openSub">רגע…</small></button>
    <p class="gate-msg" id="msg"></p>
    <p class="note" style="text-align:center" id="hint">לחצו כשאתם מול השער. הוא נפתח תוך כמה שניות.</p>
  </section>

  <section class="panel where" aria-label="איפה חונים">
    <div class="sign" aria-hidden="true"><img src="logo-black.png" alt="LEOS Media &amp; Interactive"><span class="guest">אורחים</span></div>
    <div><h2>חונים רק מתחת לשלט "לאוס מדיה · אורחים"</h2>
      <p>בחניון יש הרבה חניות. רק <b>שתי החניות שמעליהן תלוי השלט הזה</b> שמורות לכם. חונים באחת מהן, זו שפנויה.</p></div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const { hm, dateLabel, plateHTML } = PK, $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search), b = q.get("b"), t = q.get("t");
const C = window.PARKING_CONFIG;
async function call(action) {
  const r = await fetch(`${C.SUPABASE_URL}/functions/v1/parking-gate`, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: C.SUPABASE_KEY, Authorization: `Bearer ${C.SUPABASE_KEY}` },
    body: JSON.stringify({ action, b, t }) });
  return { http: r.status, ...(await r.json().catch(() => ({}))) };
}
let info = null;
function show(i) {
  info = i;
  if (i.http === 404 || !i.state) {
    $("sub").textContent = "הקישור לא תקף";
    $("openSub").textContent = "לא זמין";
    $("msg").textContent = "הקישור לא תקף או שההזמנה בוטלה. פנו למי ששלח לכם אותו.";
    $("hint").hidden = true; return;
  }
  $("sub").innerHTML = `${dateLabel(i.day, true)} · ${hm(i.start)}–${hm(i.end)}`;
  const btn = $("open"), on = i.state === "open";
  btn.disabled = !on;
  const texts = {
    open: ["לחצו לפתיחה", ""],
    early: ["עוד לא", `השער ייפתח מהשעה ${hm(i.from)}${i.day !== PK.israelNow().day ? ", " + dateLabel(i.day, true) : ""}.`],
    ended: ["ההזמנה הסתיימה", "זמן ההזמנה עבר."],
    limit: ["הגעתם למקסימום", "השער כבר נפתח כאן מספר הפעמים המותר. צריכים עוד? פנו למשרד."],
    unavailable: ["לא זמין כרגע", "פתיחה מהקישור לא זמינה כרגע. פנו למשרד."],
  }[i.state];
  $("openSub").textContent = texts[0];
  if (!btn.classList.contains("ok")) $("msg").textContent = texts[1];
}
$("open").onclick = async () => {
  const btn = $("open"); btn.disabled = true; $("openSub").textContent = "פותח…"; $("msg").textContent = "";
  let r; try { r = await call("open"); } catch { r = {}; }
  if (r.ok) {
    btn.classList.add("ok"); $("openSub").textContent = "נפתח ✓"; $("msg").textContent = "השער נפתח. סעו בזהירות וחנו מתחת לשלט.";
    if (navigator.vibrate) navigator.vibrate(80);
    setTimeout(() => { btn.classList.remove("ok"); show({ ...info, ...r, http: 200 }); }, 20000);
  } else if (r.state && r.state !== "open") { show({ ...r, http: 200 }); }
  else { $("msg").textContent = "השער לא הגיב. נסו שוב בעוד רגע."; setTimeout(() => show(info), 1500); }
};
(async () => {
  if (!b || !t) return show({ http: 404 });
  try { show(await call("info")); } catch { $("msg").textContent = "אין חיבור. בדקו את האינטרנט ונסו שוב."; }
  setInterval(async () => { if ($("open").classList.contains("ok")) return; try { show(await call("info")); } catch {} }, 30000);
})();
</script>
</body>
</html>
